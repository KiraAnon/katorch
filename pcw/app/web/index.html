<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.json">
<title>KAtorch 生图</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0b0e13;color:#e6edf3;
  font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
  overscroll-behavior:none}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:14px}
h1{font-size:17px;margin:0 0 4px;font-weight:600;letter-spacing:.5px}
h1 span{color:#f0a05a}
.sub{font-size:11px;color:#7d8590;margin-bottom:14px}
.card{background:#151b23;border:1px solid #232b36;border-radius:14px;padding:12px;margin-bottom:12px}
textarea{width:100%;min-height:86px;background:#0d1117;color:#e6edf3;border:1px solid #2a3441;
  border-radius:10px;padding:10px;font-size:14px;line-height:1.45;resize:vertical;outline:none;
  font-family:inherit}
textarea:focus{border-color:#f0a05a}
.row{display:flex;gap:8px;margin-top:10px;align-items:center}
button{flex:1;background:linear-gradient(135deg,#f0a05a,#e07b39);color:#1a1208;border:0;
  border-radius:10px;padding:13px;font-size:15px;font-weight:700;letter-spacing:.5px}
button:disabled{opacity:.45}
button.ghost{flex:0 0 76px;background:#1c232c;color:#9aa4af;font-weight:500;font-size:13px}
input[type=number]{width:88px;background:#0d1117;color:#e6edf3;border:1px solid #2a3441;
  border-radius:10px;padding:11px;font-size:14px;text-align:center;outline:none}
.lbl{font-size:11px;color:#7d8590;margin-bottom:6px}
.bar{height:6px;background:#0d1117;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#f0a05a,#e07b39);
  transition:width .35s ease}
.stat{font-size:11px;color:#7d8590;margin-top:7px;display:flex;justify-content:space-between}
.stage{position:relative;background:#0d1117;border-radius:12px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:300px}
.stage img{width:100%;display:block;border-radius:12px}
.ph{color:#39424e;font-size:13px;text-align:center;padding:40px 20px;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.chip{background:#1c232c;color:#9aa4af;border:1px solid #2a3441;border-radius:999px;
  padding:7px 12px;font-size:12px;white-space:nowrap}
.chip:active{background:#2a3441}
.gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#0d1117}
.err{background:#3d1418;border:1px solid #6b1f26;color:#ff9a9a;border-radius:10px;
  padding:10px;font-size:12px;margin-top:10px;line-height:1.5;word-break:break-all}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>KAtorch <span>NPU</span> 生图</h1>
  <div class="sub">手机 NPU · 512×512 · 8 步 · 约 2 分钟</div>

  <div class="card">
    <div class="lbl">提示词</div>
    <textarea id="p" placeholder="描述你想要的画面，例如：1girl, white dress, standing in water, night, stars">masterpiece, best quality, very aesthetic, 1girl, solo, white dress, long white hair, standing in shallow water, soft lighting, full body, detailed eyes</textarea>
    <div class="chips" id="chips"></div>
    <div class="row">
      <input type="number" id="seed" value="42" min="0" max="999999" title="种子">
      <button id="go">生 成</button>
      <button class="ghost" id="rnd">随机</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="stat"><span id="msg">空闲</span><span id="eta"></span></div>
    <div class="err hide" id="err"></div>
  </div>

  <div class="stage" id="stage">
    <div class="ph" id="ph">生成结果会显示在这里</div>
  </div>

  <div class="card" style="margin-top:12px">
    <div class="lbl">最近生成</div>
    <div class="gal" id="gal"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const PRESETS = [
  "1girl, white dress, standing in water, night sky, stars, glowing",
  "1girl, long silver hair, blue eyes, casual outfit, city street, daylight",
  "1girl, school uniform, cherry blossoms, spring, soft light",
  "1girl, sleeping, bed, morning light, cozy room",
  "1girl, kimono, festival, fireworks, night",
  "1girl, cat ears, hoodie, rainy window, moody",
  "1boy, black hair, suit, rooftop, sunset, cinematic",
  "landscape, mountain lake, sunrise, mist, highly detailed",
  "1girl, white hair, black dress, gothic, moonlight, castle",
  "1girl, swimsuit, beach, summer, blue sky, clouds",
  "1girl, glasses, reading, library, warm light",
  "1girl, dancing, flowers, petals, dynamic pose",
];
let busy = false, timer = null;

function chips(){
  const c = $("#chips");
  PRESETS.forEach(t=>{
    const d = document.createElement("div");
    d.className = "chip";
    d.textContent = t.split(",").slice(0,3).join(",").slice(0,18);
    d.onclick = ()=>{ $("#p").value = t; };
    c.appendChild(d);
  });
}
chips();

async function poll(){
  try{
    const s = await (await fetch("/api/status")).json();
    const pct = s.total ? Math.round(100*s.step/s.total) : 0;
    $("#prog").style.width = (s.busy ? pct : (s.image?100:0)) + "%";
    $("#msg").textContent = s.msg || "";
    $("#eta").textContent = s.busy && s.last_sec
        ? "第 " + s.step + "/" + s.total + " 步 · " + Math.round(s.last_sec) + "s"
        : (s.elapsed ? Math.round(s.elapsed) + "s 完成" : "");
    if(s.error){ $("#err").classList.remove("hide"); $("#err").textContent = s.error; }
    else $("#err").classList.add("hide");
    if(s.image){
      const u = "/img/" + s.image + "?t=" + Date.now();
      $("#stage").innerHTML = '<img src="'+u+'">';
      loadGal();
    }
    if(busy && !s.busy){ busy = false; $("#go").disabled = false; $("#go").textContent = "生 成"; }
  }catch(e){}
}

async function loadGal(){
  try{
    const list = await (await fetch("/api/gallery")).json();
    const g = $("#gal"); g.innerHTML = "";
    list.forEach(it=>{
      const f = it.f || it;
      const i = document.createElement("img");
      i.src = "/img/"+f; i.loading="lazy";
      if (it.prompt) i.title = it.prompt + "  (seed " + (it.seed||"") + ", " + (it.time||"") + ")";
      i.onclick = ()=>{
        $("#stage").innerHTML='<img src="/img/'+f+'">';
        if (it.prompt) { $("#p").value = it.prompt; }
        if (it.seed !== undefined) { $("#seed").value = it.seed; }
      };
      g.appendChild(i);
    });
  }catch(e){}
}

$("#go").onclick = async ()=>{
  if(busy) return;
  const prompt = $("#p").value.trim();
  if(!prompt) return;
  busy = true; $("#go").disabled = true; $("#go").textContent = "生成中…";
  $("#err").classList.add("hide");
  try{
    const r = await fetch("/api/generate", {method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({prompt, seed: parseInt($("#seed").value)||42})});
    const d = await r.json();
    if(!d.ok){ busy=false; $("#go").disabled=false; $("#go").textContent="生 成";
      $("#err").classList.remove("hide"); $("#err").textContent = d.err||"失败"; }
  }catch(e){
    busy=false; $("#go").disabled=false; $("#go").textContent="生 成";
    $("#err").classList.remove("hide"); $("#err").textContent = "请求失败: "+e;
  }
};

$("#rnd").onclick = ()=>{ $("#seed").value = Math.floor(Math.random()*999999); };

// 注册 service worker（Chrome 判定可安装 PWA 的必要条件）
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}

timer = setInterval(poll, 1000);
poll(); loadGal();

// 页面切到后台/关掉时停止轮询 —— 服务端没请求了，到时间就会自己退出并释放内存
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    if (timer) { clearInterval(timer); timer = null; }
  } else {
    if (!timer) { timer = setInterval(poll, 1000); poll(); }
  }
});
</script>
</body>
</html>
